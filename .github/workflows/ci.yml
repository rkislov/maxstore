name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:css
      - run: git diff --exit-code web/style.css
      - run: test -z "$(gofmt -l cmd internal web/*.go)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/maxstore ./cmd/maxstore
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maxstore:test .
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y rclone
      - run: aws --version && rclone version
      - run: python3 scripts/s3-smoke.py
